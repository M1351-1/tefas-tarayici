name: tefas_mobil
description: >-
  TEFAS'taki yatırım fonlarını kategori içinde puanlayıp sıralayan Android
  uygulaması. Bir hesaplama ve karşılaştırma aracıdır, yatırım tavsiyesi
  değildir.
publish_to: "none"
# SURUM BURADA DURUR, DERLEME KOMUTUNDA DEGIL.
#
# Telefondaki APK versionCode=1, versionName=0.1.0 (aapt2 ile okundu).
# Android daha dusuk bir versionCode'u ustune kurdurmaz; surumu
# `--build-number` gibi bir bayrakla vermek ise belgelenmis komutla
# (BENIOKU.md: `flutter build apk --release`) yeniden derleyen herkesin
# yine 1 uretmesi demek olurdu. Konut projesinde tam olarak bu yasandi.
#
# Imza: release yapisi debug anahtar deposuyla imzalaniyor
# (build.gradle.kts) ve o depo 28 Agustos'tan beri ayni. applicationId
# de degismedi — yani APK mevcut uygulamanin USTUNE kurulur, kaldirmaya
# ve veri kaybina gerek yok.
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Hazır veri dosyasını indirmek için
  http: ^1.2.2

  # Önbellek dosyasının nereye yazılacağını bulmak için
  path_provider: ^2.1.4
  path: ^1.9.0

  # Favoriler, tema tercihi, veri adresi
  shared_preferences: ^2.3.2

  # Claude API anahtarı için. Android'de EncryptedSharedPreferences kullanır;
  # anahtar düz metin olarak diskte durmaz.
  flutter_secure_storage: ^9.2.2

  # NOT: Grafik paketi BİLEREK eklenmedi. Fiyat grafiğini CustomPainter ile
  # kendimiz çiziyoruz; hazır paketler Türkçe sayı biçimini ve dokunmalı
  # okumayı zorlaştırıyor, ayrıca APK'yı şişiriyor.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Çekirdek testleri `dart test` ile koşuyor, `flutter test` ile değil:
  # bu makinede Windows Uygulama Denetimi ilkesi flutter_tester.exe'yi
  # engelliyor. Çekirdek (modeller/puanlama/secici) Flutter'a bağımlı
  # olmadığı için saf Dart VM'de sorunsuz koşuyor.
  test: ^1.25.0

flutter:
  uses-material-design: true

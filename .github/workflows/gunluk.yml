# Günlük TEFAS veri toplama.
#
# TEFAS fiyatları akşam güncelleniyor; hafta içi Türkiye saatiyle 20:00'de
# (17:00 UTC) çalışıyoruz. Daha erken çalıştırırsanız bir önceki günün
# verisini alırsınız.
#
# BİLİNEN RİSK: TEFAS'ta Akamai koruması var ve bulut sunucu IP'lerini
# engellemesi yaygın. Bu iş akışı ilk çalıştığında engellenirse şaşırmayın;
# yedek plan BENIOKU.md'de: toplayıcıyı kendi bilgisayarınızda Windows
# Görev Zamanlayıcı ile çalıştırıp sonucu buraya göndermek.
name: Gunluk TEFAS guncellemesi

on:
  schedule:
    # Hafta içi 17:00 UTC = TR 20:00. GitHub cron'u UTC kullanır ve
    # Türkiye yaz saati uygulamadığı için sabit ofset doğru.
    - cron: "0 17 * * 1-5"
  workflow_dispatch: # elle de çalıştırılabilsin

# Aynı anda iki çalışma olmasın: ikisi de TEFAS'a istek atarsa
# dakikada 6 sınırı aşılır ve ikisi de başarısız olur.
concurrency:
  group: tefas-toplama
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Veritabanini onbellekten getir
        id: onbellek
        uses: actions/cache@v4
        with:
          path: data/fon_gecmis.db
          # Anahtara tarih koymuyoruz: her gun ayni anahtari kullanip
          # uzerine yaziyoruz ki gecmis birikerek devam etsin.
          key: tefas-vt-v1
          restore-keys: tefas-vt-

      - name: Testleri kosla
        run: |
          python -m pip install --quiet pytest pyyaml
          python -m pytest toplayici/test -q

      - name: Veriyi topla
        run: |
          if [ -f data/fon_gecmis.db ]; then
            echo "Onbellekten veritabani bulundu, sadece eksik gunler cekilecek."
            python toplayici/topla.py gunluk
          else
            echo "Veritabani yok, tam dolum yapilacak (~30 dakika)."
            python toplayici/topla.py dolum
          fi

      - name: Ciktiyi dogrula
        # Bos ya da bozuk bir JSON yayimlamaktansa is akisini durdurmak
        # yeglenir: uygulamadaki kullanicilar eski veriyi gormeye devam eder.
        run: |
          python - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("data/fonlar.json")
          if not p.exists():
              sys.exit("fonlar.json uretilmedi")
          d = json.loads(p.read_text(encoding="utf-8"))
          n = len(d.get("fonlar", []))
          puanli = sum(1 for f in d["fonlar"] if f.get("puan") is not None)
          print(f"{n} fon, {puanli} puanli, veri tarihi {d.get('veri_tarihi')}")
          if n < 1000:
              sys.exit(f"Beklenenden az fon var ({n}); yayimlanmayacak.")
          if puanli < 500:
              sys.exit(f"Beklenenden az puanli fon var ({puanli}); yayimlanmayacak.")
          PY

      - name: Veriyi "veri" dalina yayimla
        env:
          GIT_AUTHOR_NAME: tefas-bot
          GIT_AUTHOR_EMAIL: tefas-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: tefas-bot
          GIT_COMMITTER_EMAIL: tefas-bot@users.noreply.github.com
        run: |
          set -e
          TARIH=$(python -c "import json;print(json.load(open('data/fonlar.json',encoding='utf-8'))['veri_tarihi'])")

          # Veri dosyalarini gecici bir yere al
          mkdir -p /tmp/yayin
          cp data/fonlar.json /tmp/yayin/
          cp -r data/gecmis /tmp/yayin/

          # "veri" dalini SIFIRDAN kur. Gecmis biriktirmiyoruz: her gun
          # 2335 dosyayi yeni commit olarak eklemek repoyu yilda
          # gigabaytlarca sisirir. Bu dal her zaman tek commit tasir.
          git checkout --orphan veri
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} +

          cp /tmp/yayin/fonlar.json .
          cp -r /tmp/yayin/gecmis .
          echo "TEFAS verisi - $TARIH tarihli. Otomatik uretildi, elle duzenlemeyin." > BENIOKU.txt

          git add -A
          git commit -m "Veri: $TARIH"
          git push --force origin veri

      - name: Ozet
        if: always()
        # Blok skalari sart: tirnaksiz bir YAML degerinin icinde "iki nokta +
        # bosluk" gecerse YAML orada yeni bir eslemeye basladigini sanip
        # dosyanin tamamini ayristiramiyor. O zaman is akisi calismiyor bile;
        # GitHub "workflow_dispatch tetikleyicisi yok" gibi alakasiz bir hata
        # veriyor ve gunlukte hicbir kayit olmuyor.
        run: |
          echo "Bitti. Veri adresi: raw.githubusercontent.com/${{ github.repository }}/veri/"
